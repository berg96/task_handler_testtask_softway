volumes:
  pg_data:
  redis_data:

services:
  postgres_db:
    image: postgres
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - pg_data://var/lib/postgresql

  redis:
    image: redis:8
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery-worker:
    build:
      context: .
    env_file: .env
    command: celery -A app.infrastructure.tasks.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis

  app:
    build:
      context: .
    env_file: .env
    depends_on:
      - postgres_db
      - redis
    restart: always
    ports:
      - '8000:8000'
